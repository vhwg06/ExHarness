name: test

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  living-doc-impact:
    runs-on: ubuntu-latest
    name: living-doc-impact
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify living-doc impact contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          classification="$(printf '%s\n' "$body" | sed -n 's/^\*\*Classification:\*\*[[:space:]]*\(CURRENT_SYSTEM_CHANGED\|CURRENT_SYSTEM_NOT_CHANGED\)[[:space:]]*$/\1/p' | head -n 1)"

          if [ -z "$classification" ]; then
            echo "PR body must declare exactly one living-doc impact classification on the **Classification:** line."
            echo "Allowed values: CURRENT_SYSTEM_CHANGED | CURRENT_SYSTEM_NOT_CHANGED"
            exit 1
          fi

          count="$(printf '%s\n' "$body" | sed -n 's/^\*\*Classification:\*\*[[:space:]]*\(CURRENT_SYSTEM_CHANGED\|CURRENT_SYSTEM_NOT_CHANGED\)[[:space:]]*$/\1/p' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "PR body must contain exactly one living-doc impact classification; found $count."
            exit 1
          fi

          echo "living-doc impact: $classification"

          if [ "$classification" = "CURRENT_SYSTEM_CHANGED" ]; then
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            printf '%s\n' "$changed"
            if ! printf '%s\n' "$changed" | grep -q '^docs/living/system/'; then
              echo "CURRENT_SYSTEM_CHANGED requires affected docs/living/system/* updates in the same PR."
              exit 1
            fi
          fi

          echo "Living-doc impact declaration gate passed. Semantic truth of the classification remains a review responsibility."

  kernel:
    runs-on: ubuntu-latest
    name: kernel-node-24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify kernel
        run: npm run verify

  blackboard:
    name: blackboard-gate
    needs: [living-doc-impact, kernel]
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.select.outputs.work }}
      publications: ${{ steps.select.outputs.publications }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node trusted/scripts/blackboard-jev-ci.mjs select
      - name: Report Blackboard gate mode
        env:
          WORK: ${{ steps.select.outputs.work }}
          PUBLICATIONS: ${{ steps.select.outputs.publications }}
        run: |
          work_count="$(jq 'length' <<<"$WORK")"
          publication_count="$(jq 'length' <<<"$PUBLICATIONS")"
          if [ "$work_count" -gt 0 ]; then
            echo "::notice::Blackboard semantic judgment required for $work_count subject(s)."
          elif [ "$publication_count" -gt 0 ]; then
            echo "::notice::Blackboard readiness publication verification required for $publication_count subject(s)."
          else
            echo "::notice::No Blackboard semantic judgment required."
          fi

  blackboard-jev:
    name: blackboard-jev
    needs: blackboard
    if: needs.blackboard.outputs.work != '[]'
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.blackboard.outputs.work) }}
    uses: vhwg06/ExHarness/.github/workflows/blackboard-jev.yml@main
    with:
      work_id: ${{ matrix.work.id }}
      candidate_sha: ${{ matrix.work.sha }}
      trusted_sha: ${{ github.event.pull_request.base.sha }}
      controller_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  readiness-verify:
    name: readiness-verify
    needs: blackboard
    if: needs.blackboard.outputs.publications != '[]'
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.blackboard.outputs.publications) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.work.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical readiness publication
        env:
          WORK_ID: ${{ matrix.work.id }}
          CANDIDATE_SHA: ${{ matrix.work.sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node trusted/scripts/blackboard-jev-ci.mjs verify-publication
