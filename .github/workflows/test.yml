name: test

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  living-doc-impact:
    runs-on: ubuntu-latest
    name: living-doc-impact
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify living-doc impact contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          classification="$(printf '%s\n' "$body" | sed -n 's/^\*\*Classification:\*\*[[:space:]]*\(CURRENT_SYSTEM_CHANGED\|CURRENT_SYSTEM_NOT_CHANGED\)[[:space:]]*$/\1/p' | head -n 1)"

          if [ -z "$classification" ]; then
            echo "PR body must declare exactly one living-doc impact classification on the **Classification:** line."
            echo "Allowed values: CURRENT_SYSTEM_CHANGED | CURRENT_SYSTEM_NOT_CHANGED"
            exit 1
          fi

          count="$(printf '%s\n' "$body" | sed -n 's/^\*\*Classification:\*\*[[:space:]]*\(CURRENT_SYSTEM_CHANGED\|CURRENT_SYSTEM_NOT_CHANGED\)[[:space:]]*$/\1/p' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "PR body must contain exactly one living-doc impact classification; found $count."
            exit 1
          fi

          echo "living-doc impact: $classification"

          if [ "$classification" = "CURRENT_SYSTEM_CHANGED" ]; then
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            printf '%s\n' "$changed"
            if ! printf '%s\n' "$changed" | grep -q '^docs/living/system/'; then
              echo "CURRENT_SYSTEM_CHANGED requires affected docs/living/system/* updates in the same PR."
              exit 1
            fi
          fi

          echo "Living-doc impact declaration gate passed. Semantic truth of the classification remains a review responsibility."

  kernel:
    runs-on: ubuntu-latest
    name: kernel-node-24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify kernel
        run: npm run verify

  blackboard:
    name: blackboard-gate
    needs: [living-doc-impact, kernel]
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.select.outputs.work }}
      publications: ${{ steps.select.outputs.publications }}
      supersessions: ${{ steps.select.outputs.supersessions }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node trusted/scripts/blackboard-jev-ci.mjs select
      - name: Report Blackboard gate mode
        env:
          WORK: ${{ steps.select.outputs.work }}
          PUBLICATIONS: ${{ steps.select.outputs.publications }}
          SUPERSESSIONS: ${{ steps.select.outputs.supersessions }}
        run: |
          work_count="$(jq 'length' <<<"$WORK")"
          publication_count="$(jq 'length' <<<"$PUBLICATIONS")"
          supersession_count="$(jq 'length' <<<"$SUPERSESSIONS")"
          if [ "$supersession_count" -gt 0 ]; then
            echo "::notice::Blackboard objective supersession verification required for $supersession_count subject(s)."
          fi
          if [ "$work_count" -gt 0 ]; then
            echo "::notice::Blackboard semantic judgment required for $work_count subject(s)."
          elif [ "$publication_count" -gt 0 ]; then
            echo "::notice::Blackboard readiness publication verification required for $publication_count subject(s)."
          else
            echo "::notice::No Blackboard semantic judgment required."
          fi

  blackboard-jev:
    name: blackboard-jev
    needs: blackboard
    if: needs.blackboard.outputs.work != '[]'
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.blackboard.outputs.work) }}
    uses: vhwg06/ExHarness/.github/workflows/blackboard-jev.yml@main
    with:
      work_id: ${{ matrix.work.id }}
      candidate_sha: ${{ matrix.work.sha }}
      trusted_sha: ${{ github.event.pull_request.base.sha }}
      controller_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit

  readiness-verify:
    name: readiness-verify
    needs: blackboard
    if: needs.blackboard.outputs.publications != '[]'
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.blackboard.outputs.publications) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.work.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical readiness publication
        env:
          WORK_ID: ${{ matrix.work.id }}
          CANDIDATE_SHA: ${{ matrix.work.sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node trusted/scripts/blackboard-jev-ci.mjs verify-publication

  objective-supersession-verify:
    name: objective-supersession-verify
    needs: blackboard
    if: needs.blackboard.outputs.supersessions != '[]'
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.blackboard.outputs.supersessions) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.work.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deterministic and secret-free: trusted PR-base scripts read candidate files as data only.
      - name: Verify objective supersession publication
        env:
          WORK_ID: ${{ matrix.work.id }}
          CANDIDATE_SHA: ${{ matrix.work.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node trusted/scripts/blackboard-jev-ci.mjs verify-supersession

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs:
      - living-doc-impact
      - kernel
      - blackboard
      - blackboard-jev
      - readiness-verify
      - objective-supersession-verify
    runs-on: ubuntu-latest
    steps:
      - name: Require complete CI for exact PR head
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LIVING_DOC_RESULT: ${{ needs.living-doc-impact.result }}
          KERNEL_RESULT: ${{ needs.kernel.result }}
          BLACKBOARD_RESULT: ${{ needs.blackboard.result }}
          WORK: ${{ needs.blackboard.outputs.work }}
          JEV_RESULT: ${{ needs.blackboard-jev.result }}
          PUBLICATIONS: ${{ needs.blackboard.outputs.publications }}
          READINESS_RESULT: ${{ needs.readiness-verify.result }}
          SUPERSESSIONS: ${{ needs.blackboard.outputs.supersessions }}
          SUPERSESSION_RESULT: ${{ needs.objective-supersession-verify.result }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }

          require_success() {
            stage="$1"
            result="$2"
            [ "$result" = "success" ] || fail "$stage must succeed; got $result"
          }

          require_skipped() {
            stage="$1"
            result="$2"
            [ "$result" = "skipped" ] || fail "$stage must be skipped when not applicable; got $result"
          }

          assert_exact_subjects() {
            label="$1"
            payload="$2"
            bad="$(jq -r --arg sha "$PR_HEAD_SHA" '[.[] | select(.sha != $sha)] | length' <<<"$payload")"
            [ "$bad" = "0" ] || fail "$label contains subject SHA different from PR head $PR_HEAD_SHA"
          }

          require_success "living-doc-impact" "$LIVING_DOC_RESULT"
          require_success "kernel" "$KERNEL_RESULT"
          require_success "blackboard-gate" "$BLACKBOARD_RESULT"

          assert_exact_subjects "blackboard work" "$WORK"
          assert_exact_subjects "readiness publications" "$PUBLICATIONS"
          assert_exact_subjects "objective supersessions" "$SUPERSESSIONS"

          if [ "$(jq 'length' <<<"$WORK")" -gt 0 ]; then
            require_success "blackboard-jev" "$JEV_RESULT"
          else
            require_skipped "blackboard-jev" "$JEV_RESULT"
          fi

          if [ "$(jq 'length' <<<"$PUBLICATIONS")" -gt 0 ]; then
            require_success "readiness-verify" "$READINESS_RESULT"
          else
            require_skipped "readiness-verify" "$READINESS_RESULT"
          fi

          if [ "$(jq 'length' <<<"$SUPERSESSIONS")" -gt 0 ]; then
            require_success "objective-supersession-verify" "$SUPERSESSION_RESULT"
          else
            require_skipped "objective-supersession-verify" "$SUPERSESSION_RESULT"
          fi

          echo "MERGE_GATE_ACCEPT candidate=$PR_HEAD_SHA"

