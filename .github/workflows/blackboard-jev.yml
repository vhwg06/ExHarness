name: blackboard-jev

on:
  workflow_call:
    inputs:
      work_id:
        description: Exact current Blackboard work id
        required: true
        type: string
      candidate_sha:
        description: Exact subject commit
        required: true
        type: string
      trusted_sha:
        description: Exact trusted control-plane commit
        required: true
        type: string
      controller_sha:
        description: Exact trusted evaluator/controller implementation commit
        required: false
        type: string
    secrets:
      TYPESAFE_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      work_id:
        description: Exact current Blackboard work id
        required: true
        type: string
      candidate_sha:
        description: Exact subject commit
        required: false
        type: string
      trusted_sha:
        description: Exact trusted control-plane commit
        required: false
        type: string
      controller_sha:
        description: Exact trusted evaluator/controller implementation commit
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: blackboard-jev-${{ inputs.work_id }}-${{ inputs.candidate_sha || 'current' }}
  cancel-in-progress: false

jobs:
  select:
    name: validate Jev subject
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.select.outputs.work }}
      trusted_sha: ${{ steps.trusted.outputs.sha }}
      controller_sha: ${{ steps.controller.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.controller_sha || 'main' }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - id: controller
        run: echo "sha=$(git -C controller rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_sha || 'main' }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - id: trusted
        run: echo "sha=$(git -C trusted rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || inputs.trusted_sha || 'main' }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - id: subject
        run: echo "sha=$(git -C subject rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: select
        env:
          WORK_ID: ${{ inputs.work_id }}
          CANDIDATE_SHA: ${{ steps.subject.outputs.sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node controller/scripts/blackboard-jev-ci.mjs select
      - name: Require exactly one evaluation subject
        env:
          WORK: ${{ steps.select.outputs.work }}
        run: |
          count="$(jq 'length' <<<"$WORK")"
          test "$count" = "1" || { echo "Expected exactly one Jev subject, got $count"; exit 1; }

  evidence:
    name: collect Jev evidence (${{ matrix.work.id }})
    needs: select
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.select.outputs.work) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.controller_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.work.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect evidence without provider credentials
        env:
          WORK_ID: ${{ matrix.work.id }}
          CANDIDATE_SHA: ${{ matrix.work.sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node controller/scripts/blackboard-jev-ci.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: jev-input-${{ matrix.work.id }}
          path: subject/artifacts/blackboard-verification/
          if-no-files-found: error

  evaluate:
    name: Jev evaluate (${{ matrix.work.id }})
    needs: [select, evidence]
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.select.outputs.work) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.controller_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.work.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: jev-input-${{ matrix.work.id }}
          path: subject/artifacts/blackboard-verification/
      - uses: actions/cache/restore@v4
        with:
          path: subject/.cache/blackboard-jev
          key: jev-${{ matrix.work.id }}-${{ github.run_id }}
          restore-keys: jev-${{ matrix.work.id }}-
      - name: Materialize, evaluate and validate using trusted evaluator
        env:
          WORK_ID: ${{ matrix.work.id }}
          CANDIDATE_SHA: ${{ matrix.work.sha }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node controller/scripts/blackboard-jev-ci.mjs evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-evaluation-${{ matrix.work.id }}
          path: subject/artifacts/blackboard-jev/
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always() && hashFiles('subject/.cache/blackboard-jev/*.json') != ''
        with:
          path: subject/.cache/blackboard-jev
          key: jev-${{ matrix.work.id }}-${{ github.run_id }}
