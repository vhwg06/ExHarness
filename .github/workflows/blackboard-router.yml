name: blackboard-router

on:
  workflow_run:
    workflows: [test]
    types: [completed]

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: blackboard-router-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  select:
    name: route Blackboard judgment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.select.outputs.work }}
      publications: ${{ steps.select.outputs.publications }}
      trusted_sha: ${{ steps.select.outputs.trusted_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Pin trusted checkout to exact PR base
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          pulls="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls"             -f state=all             -f head="${REPO_OWNER}:${HEAD_BRANCH}"             -f per_page=100)"
          trusted_sha="$(jq -r --arg sha "$CANDIDATE_SHA" '[.[] | select(.head.sha == $sha) | .base.sha][0] // empty' <<<"$pulls")"
          test -n "$trusted_sha" || { echo "No exact PR base found for $CANDIDATE_SHA"; exit 1; }
          git -C trusted fetch --no-tags origin "$trusted_sha"
          git -C trusted checkout --detach "$trusted_sha"
          echo "trusted_sha=$trusted_sha" >> "$GITHUB_ENV"
      - id: select
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node trusted/scripts/blackboard-jev-ci.mjs select

  dispatch-jev:
    name: dispatch Jev (${{ matrix.work.id }})
    needs: select
    if: needs.select.outputs.work != '[]'
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.select.outputs.work) }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact Jev evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_ID: ${{ matrix.work.id }}
          CANDIDATE_SHA: ${{ matrix.work.sha }}
          TRUSTED_SHA: ${{ needs.select.outputs.trusted_sha }}
        run: |
          jq -n             --arg ref "main"             --arg work_id "$WORK_ID"             --arg candidate_sha "$CANDIDATE_SHA"             --arg trusted_sha "$TRUSTED_SHA"             '{ref:$ref,inputs:{work_id:$work_id,candidate_sha:$candidate_sha,trusted_sha:$trusted_sha}}' |
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/blackboard-jev.yml/dispatches"             --input -

  verify-publication:
    name: verify published Jev readiness (${{ matrix.work.id }})
    needs: select
    if: needs.select.outputs.publications != '[]'
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.select.outputs.publications) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.work.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical readiness publication against exact trusted input
        env:
          WORK_ID: ${{ matrix.work.id }}
          CANDIDATE_SHA: ${{ matrix.work.sha }}
          TRUSTED_ROOT: trusted
          SUBJECT_ROOT: subject
        run: node trusted/scripts/blackboard-jev-ci.mjs verify-publication

  no-evaluation:
    name: no Blackboard judgment required
    needs: select
    if: needs.select.outputs.work == '[]' && needs.select.outputs.publications == '[]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::No current Blackboard subject on this PR requires judgment."
